server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 32k;
    # Menu photo uploads are the one route that carries a file. The API still enforces the
    # exact 5 MB limit and validates the bytes; this only lets such a request reach it. The
    # canonical path is forwarded, so the API sees exactly the route matched here.
    location = /api/media/menu {
        client_max_body_size 6m;
        proxy_pass http://api:4000/api/media/menu;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 60s;
    }
    location /api/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 30s;
    }
    location / {
        proxy_pass http://admin:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
